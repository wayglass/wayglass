name: Skill quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install validator dependencies
        run: python -m pip install --require-hashes -r .skill-quality/requirements.txt
      - name: Validate skills and repository configuration
        run: python .skill-quality/validate.py . --output "$RUNNER_TEMP/quality-report.json"
      - name: Run repository checks
        run: python .skill-quality/run_checks.py .
      - name: Scan history and current files for secrets
        if: ${{ !cancelled() }}
        run: python .skill-quality/scan_secrets.py . --output-directory "$RUNNER_TEMP/skill-secrets"
      - name: Save validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-quality-${{ github.sha }}
          path: ${{ runner.temp }}/quality-report.json
          if-no-files-found: error
          retention-days: 30
