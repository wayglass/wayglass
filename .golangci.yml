version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # gitx exists to run git with caller-supplied args.
      - path: internal/gitx/
        linters: [gosec]
        text: "G204"
      - path: _test\.go
        linters: [gosec]
      # Wasm exports are called by the Worker, so Go sees them as unused.
      - path: cmd/policywasm/
        linters: [unused]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wayglass/wayglass
